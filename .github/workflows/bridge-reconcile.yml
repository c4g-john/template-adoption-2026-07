name: bridge reconcile (optional)

# Polices the issues against the governing documents: anything without a
# matching approved item gets labelled and alerted, and a pinned Scope report
# stays current. Dormant until BRIDGE_ENABLED is 'true'.
on:
  workflow_run:
    workflows: ["bridge scaffold (optional)"]
    types: [completed]
  push:
    branches: [main]
    paths: ["documents/**"]
  issues:
    types: [opened, reopened, edited]
  repository_dispatch:
    types: [bridge-reconcile]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: (vars.BRIDGE_ENABLED == 'true' && (github.event_name != 'issues' || github.actor != 'github-actions[bot]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: c4g-john/docassert-action/install@v1
      - name: Reconcile issues against the documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: docassert bridge reconcile --repo "$GITHUB_REPOSITORY"
